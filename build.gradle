plugins {
    id 'eclipse'
    id 'idea'
    // NeoGradle's userdev plugin. This is the NeoForge replacement for ForgeGradle.
    // 7.0.x requires Gradle 8.10+ (7.1.x requires 9.x), hence the wrapper bump.
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

// Loader-tagged version, matching the convention Touhou Little Maid itself uses
// (e.g. touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar). Keeping the loader in the name makes
// it obvious which build you are looking at when several loaders are supported.
version = "${mod_version}-${mod_loader}+mc${mc_version}"
group = mod_group

// mod_display_name is UTF-8 in gradle.properties, but Java reads .properties as ISO-8859-1,
// so the value arrives mojibake'd. Re-decode: recover the original bytes via Latin-1, then
// interpret them as UTF-8. Removing this makes the in-game name show as garbage.
def decodeProp = { String value ->
    if (value == null) {
        return null
    }
    return new String(value.getBytes(java.nio.charset.StandardCharsets.ISO_8859_1),
            java.nio.charset.StandardCharsets.UTF_8)
}
def displayName = decodeProp(providers.gradleProperty('mod_display_name').getOrElse('Maid Legion'))

// ---------------------------------------------------------------------------
// Optional network proxy
// ---------------------------------------------------------------------------
// Some networks cannot reach maven.neoforged.net directly (the download fails with
// "Connection reset" / "SSL peer shut down incorrectly"), yet reach Mojang's CDN fine.
// Sending *everything* through such a proxy then breaks the Mojang downloads instead, so
// the proxy is applied with a nonProxyHosts exclusion list rather than globally.
//
// Opt in with either MAID_LEGION_PROXY (environment, wins) or `proxy=host:port` in
// gradle.properties. Left unset - the default - nothing is configured and the build
// behaves exactly as it would without this block, so the checked-in file works as-is for
// anyone cloning the repo. Values are read at configuration time; pass -Pproxy=... or the
// env var to override without editing files.
def parseProxyHostPort = { String spec ->
    // Accept "host:port", and tolerate a scheme prefix and trailing slash.
    def cleaned = spec.trim()
    cleaned = cleaned.replaceFirst('^[a-zA-Z][a-zA-Z0-9+.-]*://', '')
    cleaned = cleaned.replaceFirst('/+$', '')
    def idx = cleaned.lastIndexOf(':')
    if (idx <= 0) {
        return null
    }
    def port = cleaned.substring(idx + 1)
    if (!port.isInteger()) {
        return null
    }
    return [host: cleaned.substring(0, idx), port: port]
}

def proxySpec = System.getenv('MAID_LEGION_PROXY')
if (proxySpec == null || proxySpec.trim().isEmpty()) {
    proxySpec = providers.gradleProperty('proxy').getOrElse('')
}
if (proxySpec != null && !proxySpec.trim().isEmpty()) {
    def parsed = parseProxyHostPort(proxySpec)
    if (parsed == null) {
        throw new GradleException(
                "Could not parse proxy '${proxySpec}'. Expected host:port, e.g. 127.0.0.1:7897")
    }
    // Sites that are reliably reachable directly here; proxying them is what caused
    // "SSL peer shut down incorrectly", so they are always excluded.
    def directHosts = [
            'localhost', '127.0.0.1', '[::1]',
            'mojang.com', '*.mojang.com', 'minecraft.net', '*.minecraft.net',
            'gradle.org', '*.gradle.org', 'services.gradle.org',
            'maven.apache.org', '*.maven.apache.org', 'repo1.maven.org',
            'parchmentmc.org', '*.parchmentmc.org'
    ]
    // Only ever ADD to an existing list, so an outer -Dhttp.nonProxyHosts is respected.
    def existing = System.getProperty('http.nonProxyHosts')
    def merged = (existing == null || existing.trim().isEmpty())
            ? directHosts.join('|')
            : existing + '|' + directHosts.join('|')

    System.setProperty('http.proxyHost', parsed.host)
    System.setProperty('http.proxyPort', parsed.port)
    System.setProperty('https.proxyHost', parsed.host)
    System.setProperty('https.proxyPort', parsed.port)
    System.setProperty('http.nonProxyHosts', merged)
    logger.lifecycle("Maid Legion: routing maven.neoforged.net through proxy ${parsed.host}:${parsed.port}")
}

// ---------------------------------------------------------------------------
// Optional JDK hint for toolchain resolution
// ---------------------------------------------------------------------------
// Not required: Gradle finds JDK 21 via JAVA_HOME, the OS, or by auto-provisioning it.
// Set MAID_LEGION_JDK_PATHS or `jdk_paths=` only when detection picks the wrong JDK.
def jdkPaths = System.getenv('MAID_LEGION_JDK_PATHS')
if (jdkPaths == null || jdkPaths.trim().isEmpty()) {
    jdkPaths = providers.gradleProperty('jdk_paths').getOrElse('')
}
if (jdkPaths != null && !jdkPaths.trim().isEmpty()) {
    System.setProperty('org.gradle.java.installations.paths', jdkPaths)
    logger.lifecycle("Maid Legion: JDK search paths set to ${jdkPaths}")
}

// The archive name is plain ASCII: mod_id, version, loader, mc version.
base {
    archivesName = mod_id
}

// 1.21 requires Java 21. The 1.20 branch targets 17; do not copy that value here or the
// game will refuse to load the mod with an UnsupportedClassVersionError.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// NeoGradle 7 run configuration.
//
// This deliberately differs from the 1.20 branch, which uses ForgeGradle's
// `minecraft { runs { ... } }` block. NeoGradle moved runs out of `minecraft` into a
// top-level `runs { ... }` container, and the `client` / `server` entries are *run types*
// that NeoForge supplies - they are created automatically, so the block below only
// customises them rather than defining them.
//
// Properties are set in bulk through systemProperties/arguments maps, not with the
// repeated `property 'k', 'v'` / `args '...'` calls ForgeGradle used. The command name is
// also not a NeoForge one: `neoforge.enabledGameTestNamespaces` is the NeoForge spelling
// that replaced Forge's `forge.enabledGameTestNamespaces`.
runs {
    configureEach { run ->
        // Adding the main source set is what makes `runClient` actually load this mod.
        run.modSource sourceSets.main
        run.systemProperties = [
                'forge.logging.markers'             : 'REGISTRIES',
                'forge.logging.console.level'       : 'debug',
                'neoforge.enabledGameTestNamespaces': mod_id
        ]
    }

    server {
        arguments.addAll '--nogui'
    }
}

repositories {
    // TLM is not published to any Maven repository, so it is resolved from a local flat-dir
    // repo. This form (rather than files(...)) is what lets NeoGradle deobfuscate the jar,
    // which is required for its API to be usable at compile time.
    //
    // Pointed at a version-specific subdirectory rather than all of libs/, because libs/
    // legitimately holds one jar per branch (1.20 Forge and 1.21 NeoForge). flatDir matches
    // on filename, and both TLM jars share the name pattern touhoulittlemaid-<version>.jar,
    // so a shared directory would let the wrong loader's build be picked - which is exactly
    // what happened: the Forge jar reached the NeoForge test runtime and failed with
    // "EntityMaid overrides final method Entity.getEyeHeight".
    flatDir {
        dirs 'libs/mc1.21.1'
    }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // compileOnly for the API surface, runtimeOnly so runClient can actually load TLM.
    // Never `implementation`: shipping TLM inside this jar would breach its licence
    // (code MIT, assets CC BY-NC-SA) and cause duplicate-class conflicts.
    compileOnly "tlm:touhoulittlemaid:1.5.3-neoforge+mc1.21.1"
    runtimeOnly "tlm:touhoulittlemaid:1.5.3-neoforge+mc1.21.1"

    testImplementation 'junit:junit:4.13.2'
    // TLM is compileOnly, so it is missing from the test compile classpath even though the
    // tests reference EntityMaid and its item types. Adding it explicitly keeps the tests
    // compiling against the same API the main sources use.
    testCompileOnly "tlm:touhoulittlemaid:1.5.3-neoforge+mc1.21.1"
    testRuntimeOnly "tlm:touhoulittlemaid:1.5.3-neoforge+mc1.21.1"
}

tasks.named('processResources', ProcessResources).configure {
    // neoforge.mods.toml is read by NeoForge as UTF-8, so the expansion must not fall back to
    // the platform encoding (which on a Chinese Windows is GBK and would corrupt the name).
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_display_name: displayName,
            mod_version     : mod_version,
            mod_authors     : mod_authors,
            mod_description : mod_description,
            mc_version      : mc_version,
            neoforge_version: neoforge_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    // NeoGradle reobfuscates as part of the build; there is no ForgeGradle-style
    // `finalizedBy 'reobfJar'` step to add here.
}

// The jar name already carries everything needed (mod id, version, loader, mc version),
// so no post-processing rename step is required.

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    // The unit tests are pure logic tests and must not try to load a NeoForge runtime.
    useJUnit()
}
