plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

// Loader-tagged version, matching the convention Touhou Little Maid itself uses
// (e.g. touhoulittlemaid-1.5.3-forge+mc1.20.1.jar). Keeping the loader in the name makes it
// obvious which build you are looking at once a Fabric or NeoForge port exists.
version = "${mod_version}-${mod_loader}+mc${mc_version}"
group = mod_group

// mod_display_name is UTF-8 in gradle.properties, but Java reads .properties as ISO-8859-1,
// so the value arrives mojibake'd. Re-decode: recover the original bytes via Latin-1, then
// interpret them as UTF-8. Removing this makes the in-game name show as garbage.
def decodeProp = { String value ->
    if (value == null) {
        return null
    }
    return new String(value.getBytes(java.nio.charset.StandardCharsets.ISO_8859_1),
            java.nio.charset.StandardCharsets.UTF_8)
}
def displayName = decodeProp(providers.gradleProperty('mod_display_name').getOrElse('Maid Manager'))

// ---------------------------------------------------------------------------
// Optional network proxy
// ---------------------------------------------------------------------------
// Only needed when this network cannot reach maven.minecraftforge.net /
// maven.neoforged.net directly (downloads fail with "Connection reset" or "SSL peer shut
// down incorrectly"). Those hosts are reachable through a local proxy, while Mojang's CDN
// is reachable directly and *breaks* when proxied - hence the nonProxyHosts list instead
// of a blanket proxy.
//
// Opt in with MAID_LEGION_PROXY (environment, wins) or `proxy=host:port` in
// gradle.properties. Unset - the default - configures nothing at all, so a fresh clone
// builds with no machine-specific settings.
def parseProxyHostPort = { String spec ->
    // Accept "host:port", tolerating a scheme prefix and a trailing slash.
    def cleaned = spec.trim()
    cleaned = cleaned.replaceFirst('^[a-zA-Z][a-zA-Z0-9+.-]*://', '')
    cleaned = cleaned.replaceFirst('/+$', '')
    def idx = cleaned.lastIndexOf(':')
    if (idx <= 0) {
        return null
    }
    def port = cleaned.substring(idx + 1)
    if (!port.isInteger()) {
        return null
    }
    return [host: cleaned.substring(0, idx), port: port]
}

def proxySpec = System.getenv('MAID_LEGION_PROXY')
if (proxySpec == null || proxySpec.trim().isEmpty()) {
    proxySpec = providers.gradleProperty('proxy').getOrElse('')
}
if (proxySpec != null && !proxySpec.trim().isEmpty()) {
    def parsed = parseProxyHostPort(proxySpec)
    if (parsed == null) {
        throw new GradleException(
                "Could not parse proxy '${proxySpec}'. Expected host:port, e.g. 127.0.0.1:7897")
    }
    def directHosts = [
            'localhost', '127.0.0.1', '[::1]',
            'mojang.com', '*.mojang.com', 'minecraft.net', '*.minecraft.net',
            'gradle.org', '*.gradle.org', 'services.gradle.org',
            'maven.apache.org', '*.maven.apache.org', 'repo1.maven.org',
            'parchmentmc.org', '*.parchmentmc.org'
    ]
    // Only ever ADD to an existing list, so an outer -Dhttp.nonProxyHosts is respected.
    def existing = System.getProperty('http.nonProxyHosts')
    def merged = (existing == null || existing.trim().isEmpty())
            ? directHosts.join('|')
            : existing + '|' + directHosts.join('|')

    System.setProperty('http.proxyHost', parsed.host)
    System.setProperty('http.proxyPort', parsed.port)
    System.setProperty('https.proxyHost', parsed.host)
    System.setProperty('https.proxyPort', parsed.port)
    System.setProperty('http.nonProxyHosts', merged)
    logger.lifecycle("Maid Manager: routing the mod mavens through proxy ${parsed.host}:${parsed.port}")
}

// ---------------------------------------------------------------------------
// Optional JDK hint for toolchain resolution
// ---------------------------------------------------------------------------
// Not required: Gradle finds a suitable JDK via JAVA_HOME, the OS, or auto-provisioning.
// Set MAID_LEGION_JDK_PATHS or `jdk_paths=` only when detection picks the wrong JDK.
def jdkPaths = System.getenv('MAID_LEGION_JDK_PATHS')
if (jdkPaths == null || jdkPaths.trim().isEmpty()) {
    jdkPaths = providers.gradleProperty('jdk_paths').getOrElse('')
}
if (jdkPaths != null && !jdkPaths.trim().isEmpty()) {
    System.setProperty('org.gradle.java.installations.paths', jdkPaths)
    logger.lifecycle("Maid Manager: JDK search paths set to ${jdkPaths}")
}

// The archive name is plain ASCII: mod_id, version, loader, mc version.
base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    // TLM is not published to any Maven repository, so it is resolved from a local
    // flat-dir repo. This form (rather than files(...)) is what lets ForgeGradle
    // deobfuscate the jar, which is required for its API to be usable at compile time.
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // compileOnly for the API surface, runtimeOnly so runClient can actually load TLM.
    // Never `implementation`: shipping TLM inside this jar would breach its licence
    // (code MIT, assets CC BY-NC-SA) and cause duplicate-class conflicts.
    compileOnly fg.deobf("tlm:touhoulittlemaid:1.5.3-forge+mc1.20.1")
    runtimeOnly fg.deobf("tlm:touhoulittlemaid:1.5.3-forge+mc1.20.1")

    testImplementation 'junit:junit:4.13.2'
}

tasks.named('processResources', ProcessResources).configure {
    // mods.toml is read by Forge as UTF-8, so the expansion must not fall back to the
    // platform encoding (which on a Chinese Windows is GBK and would corrupt the name).
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_display_name: displayName,
            mod_version     : mod_version,
            mod_authors     : mod_authors,
            mod_description : mod_description,
            mc_version      : mc_version,
            forge_version   : forge_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure({
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
})

// The jar name already carries everything needed (mod id, version, loader, mc version),
// so no post-processing rename step is required.

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
