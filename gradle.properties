org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true

# The network here is intermittent, so prefer waiting over failing a long build.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# --- Machine-specific network workaround -----------------------------------------------
# On this machine Mojang's CDN (piston-data / piston-meta) is reachable directly, but
# maven.neoforged.net is not: without a proxy it fails with "Connection reset" / "SSL peer
# shut down incorrectly". Routing *everything* through the proxy instead breaks the Mojang
# downloads, so the proxy is enabled but Mojang/Gradle/Maven Central are excluded via
# nonProxyHosts. Delete the five systemProp.* lines below on an unrestricted network.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]|mojang.com|*.mojang.com|minecraft.net|*.minecraft.net|gradle.org|*.gradle.org|maven.apache.org|*.maven.apache.org|parchmentmc.org|*.parchmentmc.org

mod_id=maid_manager
mod_name=Maid Manager
# Shown in the in-game mod list. Kept separate from mod_id (which must stay ASCII) so the
# displayed name can be localised without touching the internal identifiers.
mod_display_name=女仆管理终端
# Loader this build targets. Minecraft 1.21 ships NeoForge only - Forge never released a
# 1.21 build, and Touhou Little Maid is NeoForge-only on 1.21.1 as well.
mod_loader=neoforge
mod_version=1.0.0
mod_group=com.dsh.maidmanager
mod_authors=DSH
mod_description=A full-screen terminal to manage, summon and store multiple Touhou Little Maid maids.

mc_version=1.21.1
neoforge_version=21.1.209
mapping_channel=parchment
mapping_version=2024.11.17-1.21.1

org.gradle.java.installations.paths=/path/to/jdk-21,/path/to/jdk-17
