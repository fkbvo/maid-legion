modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/fkbvo/maid-manager/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Targets Minecraft 1.21.1 on NeoForge. Unlike the 1.20 branch, this file must be named
# neoforge.mods.toml: NeoForge renamed it and no longer reads META-INF/mods.toml.
[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    mandatory = true
    versionRange = "[21.1.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "touhou_little_maid"
    mandatory = true
    versionRange = "[1.5.0,)"
    ordering = "AFTER"
    side = "BOTH"
