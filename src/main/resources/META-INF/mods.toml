modLoader = "javafml"
loaderVersion = "[46,)"
license = "MIT"
issueTrackerURL = "https://github.com/fkbvo/maid-legion/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Targets Minecraft 1.20 and 1.20.1 (both use Forge 47.x). The half-open range accepts
# either, matching how Touhou Little Maid itself declares its own support.
[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20,1.20.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,48)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "touhou_little_maid"
    mandatory = true
    versionRange = "[1.5.0,)"
    ordering = "AFTER"
    side = "BOTH"
