pluginManagement {
    repositories {
        gradlePluginPortal()
        // NeoGradle's userdev plugin lives here, and NeoForge itself is resolved from the
        // NeoForged Maven below (maven.minecraftforge.net no longer hosts 1.21 artifacts).
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'maid-manager'
